body:
  text: 元始天尊說甘露昇天神呪妙經爾時元始天尊在西那玉國香林園中七寳蓮華座上與天中神仙說无上真道令入大乗生解脫門離於空見後與天地神仙說五行運化見應功徳小乗妙道盡十方空界令入道域又言有鬼中仙夫鬼中仙者昔於人中行三千隂功死經太隂不入惡趣變化作用與鬼神等功徳力及乃成鬼仙今爲說九化鍊隂生屍章令生陽輝上昇九天又說十方九地之下三塗地獄善惡報應因縁福果无不該備是時法㑹中有一童子名曰静明月光從座而起稽首仰面讃歎華麗稀有大慈廣爲天人說諸法相各令解脫小臣今日得面聖顔臣有所疑上聞玄造願開金口廣布慈雲適見天尊說三塗五苦地獄寃罪无有休息今見世問衆生興十惡心迷五毒行无邊无量其業无盡惡道盈溢業火熾盛聞諸衆生死入長夜廣被業牽飢渴苦辛煩燥悶絶縱遇清冰悉變猛焰其諸苦惱道意可量如是三塗須憑功徳若蒙玄化永荷洪恩伏願天尊云何救拔爾時天尊興方便意開利益門宣玉匱科傳靈寳㫖何月光童子天尊曰若有三界十方无量世界衆生死入惡道受業對者當須見在爲其亡過處取土一抔於淨器中用香華飲食散覆其上法事竟然念開業道甘露通真呪曰功徳金色光暉暉開闇幽華池流真香蓮蓋隨雲浮千靈重元和常居十二樓急宣靈寳㫖自在天堂遊天尊言此神呪若地獄亡者聞之自然快樂飲食甘露生回向心絶煩惱業再令法㑹衆念淨酆都破地獄昇天神呪茫茫酆都中重重金剛山靈寳无量光洞照炎池煩七祖諸幽魂身隨香雲繙定慧青蓮華上生神永安爾時天尊說此法竟天地中神仙龍鬼等與靜明月光童子及人天等衆一時生元量慧發无爲心入大乘門成无上道前進稽首發言善哉善哉臣今請問爲諸亡過衆生蒙轉聖道各得解脫三塗空閉九幽罷對在㑹大衆欣喜稱讃理莫能及作禮而退信奉真道元始天尊說甘露昇天神呪妙經終
